name: Deploy Application

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install controller dependencies
        run: |
          cd controller
          pip install -r requirements.txt

      - name: Validate Python code
        run: |
          python -m py_compile controller/main.py

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/python-app
          push: true
          tags: ghcr.io/somnath-001/python-test-app:${{ github.sha }}

      - name: Notify deployment controller
        run: |
          curl -X POST "${{ secrets.CONTROLLER_URL }}/webhook" \
            -H "Content-Type: application/json" \
            -d '{
              "event": "push",
              "repository": "python-test-app",
              "commit": "${{ github.sha }}",
              "image": "ghcr.io/somnath-001/python-test-app:${{ github.sha }}"
            }'
